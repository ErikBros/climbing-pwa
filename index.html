<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Beta</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#C25C42">

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Beta">
  <link rel="apple-touch-icon" href="icons/icon-180.png">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="view"></main>

  <div id="rest-banner" class="rest-banner hidden"></div>

  <nav class="bottom-nav">
    <button id="nav-train" class="nav-btn active" data-tab="train">
      <span class="nav-icon">&#9650;</span>Train
    </button>
    <button id="nav-week" class="nav-btn" data-tab="week">
      <span class="nav-icon">&#9783;</span>Week
    </button>
    <button id="nav-timer" class="nav-btn" data-tab="timer">
      <span class="nav-icon">&#9201;</span>Timer
    </button>
    <button id="nav-history" class="nav-btn" data-tab="history">
      <span class="nav-icon">&#9776;</span>History
    </button>
  </nav>

  <div id="dialog-root"></div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
